<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Terms aria-invalid</title>
</head>
<body>
<h1>Pay</h1>
<form id="pay-form" action="/thank-you" method="get">
  <label>Email <input id="email" name="email" type="email" value="pw-fixture@example.com"></label><br>
  <label><input id="terms" name="terms" type="checkbox"> I agree to the terms and conditions</label><br>
  <button id="pay" type="button">Pay now</button>
</form>
<script>
document.getElementById("pay").addEventListener("click", function () {
  var terms = document.getElementById("terms");
  if (!terms.checked) terms.setAttribute("aria-invalid", "true");
});
</script>
</body>
</html>

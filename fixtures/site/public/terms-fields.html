<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Terms fields</title>
</head>
<body>
<h1>Pay</h1>
<form id="pay-form" action="/thank-you" method="get">
  <label>Email <input id="email" name="email" type="email" value="pw-fixture@example.com"></label><br>
  <label>Full name <input name="full_name" type="text" required></label><br>
  <label>City <input name="city" type="text" pattern="[0-9]+" value="Fakeville" placeholder="Your city"></label><br>
  <label>Region <input name="region" type="text" value="Fakeregion" placeholder="Your region" aria-invalid="true"></label><br>
  <input name="promo_code" type="text" required><br>
  <input type="checkbox" name="news" aria-required="true" aria-labelledby="news-text"> <span id="news-text">Send me the newsletter</span><br>
  <input type="checkbox" name="privacy" required aria-label="Accept the privacy policy"><br>
  <label>Country <select name="country" required><option value="">Choose a country</option><option value="xx">Fakeland</option></select></label><br>
  <label>Nickname <input name="nickname" type="text" required disabled></label><br>
  <label><input type="checkbox" name="disabled_terms" required disabled> Disabled terms</label><br>
  <input name="token" type="hidden" aria-invalid="true">
  <button id="pay" type="button">Pay now</button>
</form>
</body>
</html>

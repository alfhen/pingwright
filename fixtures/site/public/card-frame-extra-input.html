<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Card frame with a hidden input</title>
</head>
<body>
<input id="cc-number" style="display:none" autocomplete="cc-number" tabindex="-1">
<label>Card number <input id="cc-number" autocomplete="cc-number" inputmode="numeric"></label><br>
<label>Expiry <input id="cc-exp" autocomplete="cc-exp"></label><br>
<label>CVC <input id="cc-csc" autocomplete="cc-csc"></label>
<script>
window.addEventListener('message', function (e) {
  if (e.data !== 'pw-pay') return;
  var inputs = document.querySelectorAll('#cc-number');
  var number = inputs[inputs.length - 1].value;
  var extra = document.getElementById('cc-exp').value + '|' + document.getElementById('cc-csc').value;
  fetch('/card-extra', { method: 'POST', body: extra }).then(function () {
    return fetch('/card-submit', { method: 'POST', body: number });
  }).then(function () {
    parent.postMessage('pw-card-submitted', '*');
  });
});
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Decoy card number document</title>
</head>
<body>
<label>Card number <input id="cc-number" name="number" autocomplete="cc-number" type="text"></label>
<script>
window.addEventListener('message', function (e) {
  if (e.data !== 'pw-pay') return;
  fetch('/card-extra', { method: 'POST', body: 'decoy:' + document.getElementById('cc-number').value });
});
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Body paths</title>
</head>
<body>
<h1>Body paths</h1>
<p>On load the page posts a JSON body and a multipart body to replay.tagreeve.invalid. The JSON body holds a foreign hash under customerHashed.country. The multipart body holds a text field with an email-shaped value and a binary file part.</p>
<script>
  var send = function (init) {
    fetch('https://replay.tagreeve.invalid/collect', init).catch(function () {});
  };
  send({
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ event: 'view', customerHashed: { country: '959a45d44e6fcf58361ed004681556fe50129f2109e817dec098c00c9e5d2578' } }),
  });
  var bytes = new Uint8Array(400);
  var seed = 7;
  for (var i = 0; i < bytes.length; i++) {
    seed = (seed * 1103515245 + 12345) & 0x7fffffff;
    bytes[i] = 0x80 + ((seed >> 16) & 0x7f);
  }
  var form = new FormData();
  form.append('contact', 'visitor@other-person.example');
  form.append('file', new Blob([bytes], { type: 'application/octet-stream' }), 'a.bin');
  send({ method: 'POST', body: form });
</script>
</body>
</html>

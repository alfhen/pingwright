<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Card expiry document</title>
</head>
<body>
<label>Expiry <input name="expiry" autocomplete="cc-exp" type="text"></label>
<script>
window.addEventListener('message', function (e) {
  if (e.data !== 'pw-pay') return;
  fetch('/card-extra', { method: 'POST', body: 'exp:' + document.querySelector('input[name="expiry"]').value });
});
</script>
</body>
</html>

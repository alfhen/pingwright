<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Test payment, split frames, marker outside</title>
<script src="/fixture-config.js"></script>
</head>
<body>
<h1>Test payment, split frames, marker outside</h1>
<p>Fake form. No real payment happens.</p>
<form id="payment-form">
  <p id="pw-test-mode">Test mode</p>
  <div id="card-container">
    <div class="field"><iframe id="card-frame-number" title="Card number" style="width:320px;height:48px"></iframe></div>
    <div class="field"><iframe id="card-frame-exp" title="Expiration date" style="width:320px;height:48px"></iframe></div>
    <div class="field"><iframe id="card-frame-csc" title="Security code" style="width:320px;height:48px"></iframe></div>
  </div>
  <button id="pay" type="submit">Pay</button>
</form>
<script>
(function () {
  var number = document.getElementById('card-frame-number');
  var frames = document.querySelectorAll('#card-container iframe');
  for (var i = 0; i < frames.length; i++) frames[i].src = window.__PW_FIXTURE.paymentFrameUrl + '/' + frames[i].id;
  window.addEventListener('message', function (e) {
    if (e.source === number.contentWindow && e.data === 'pw-card-submitted') location.href = '/thank-you-late';
  });
  document.getElementById('payment-form').addEventListener('submit', function (e) {
    e.preventDefault();
    for (var i = 0; i < frames.length; i++) frames[i].contentWindow.postMessage('pw-pay', '*');
  });
})();
</script>
</body>
</html>

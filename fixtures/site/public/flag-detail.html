<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flag detail privacy</title>
<script src="/fixture-config.js"></script>
</head>
<body>
<h1>Flag detail privacy</h1>
<p>Carries the page query into an unknown third-party image and into a sandboxed pixel frame, so the flags <code>unknownDestination</code> and <code>sandboxPageUrl</code> hold the query values. Open it with <code>?email=&lt;fake email&gt;&amp;h=&lt;hash&gt;&amp;sid=&lt;cookie value&gt;</code>. It also stores <code>sid</code> in a cookie. No banner, no tags.</p>
<script>
(function () {
  var query = location.search;
  var sid = new URLSearchParams(query).get('sid');
  if (sid) document.cookie = '_pwflag=' + encodeURIComponent(sid) + '; Path=/; Max-Age=3600';
  new Image().src = window.__PW_FIXTURE.thirdPartyUrl + '/unknown-pixel' + query;
  var frame = document.createElement('iframe');
  frame.setAttribute('sandbox', 'allow-scripts allow-forms');
  frame.style.cssText = 'width:0;height:0;border:0';
  frame.src = '/web-pixels@0.0.0-fixture/sandbox/modern/' + query;
  document.body.appendChild(frame);
})();
</script>
</body>
</html>

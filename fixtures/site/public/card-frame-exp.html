<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Card expiry frame</title>
</head>
<body>
<label>Expiry <input id="cc-exp" autocomplete="cc-exp"></label>
<script>
window.addEventListener('message', function (e) {
  if (e.data !== 'pw-pay') return;
  fetch('/card-extra', { method: 'POST', body: document.getElementById('cc-exp').value });
});
</script>
</body>
</html>

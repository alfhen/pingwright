name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack and install the tarball
        run: |
          pnpm pack
          tmp=$(mktemp -d)
          npm i -g --prefix "$tmp" ./pingwright-*.tgz
          "$tmp/bin/pingwright" --version
          echo "PW_BIN=$tmp/bin/pingwright" >> "$GITHUB_ENV"
      - name: Build a release commit
        env:
          GIT_AUTHOR_NAME: CI
          GIT_AUTHOR_EMAIL: ci@example.com
        run: |
          version=$(node -p 'require("./package.json").version')
          clone=$(mktemp -d)
          git clone -q "$GITHUB_WORKSPACE" "$clone"
          (cd "$clone" && scripts/release.sh --no-tag "$version")
          echo "RELEASE_CLONE=$clone" >> "$GITHUB_ENV"
          committer=$(git -C "$clone" log -1 --format=%cn)
          test "$committer" = CI
      - name: Refuse to release without a git identity
        run: |
          version=$(node -p 'require("./package.json").version')
          clone=$(mktemp -d)
          git clone -q "$GITHUB_WORKSPACE" "$clone"
          status=0
          (cd "$clone" && HOME=$(mktemp -d) GIT_CONFIG_NOSYSTEM=1 scripts/release.sh --no-tag "$version") || status=$?
          test "$status" = 1
      - name: Install from the release commit
        run: |
          tmp2=$(mktemp -d)
          cache=$(mktemp -d)
          npm i -g --install-links --cache "$cache" --prefix "$tmp2" "git+file://$RELEASE_CLONE#HEAD"
          # A second log means npm ran a nested git dep install.
          test "$(ls "$cache/_logs" | wc -l)" = 1
          "$tmp2/bin/pingwright" --version
          echo "GIT_BIN=$tmp2/bin/pingwright" >> "$GITHUB_ENV"
      - run: $PW_BIN install-browser
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
      - name: Run a scenario against the fixture site
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
        run: |
          pnpm fixture > fixture.log 2>&1 &
          for i in $(seq 1 30); do grep -q '^shop:' fixture.log && break; sleep 1; done
          url=$(sed -n 's/^shop: *//p' fixture.log)
          for bin in "$PW_BIN" "$GIT_BIN"; do
            set +e
            "$bin" run e2e/scenarios/reject.yml --site "$url" --out "$RUNNER_TEMP/runs" --json > summary.json
            code=$?
            set -e
            # The fixture's sandboxed pixel makes the built-in sandbox check fail, so exit 1 is expected.
            # The other expectations must pass, which shows the packaged CLI recorded and decoded hits.
            test "$code" = 1
            node -e '
              const s = JSON.parse(require("fs").readFileSync("summary.json", "utf8"));
              const failed = s.results.filter((r) => !r.pass).map((r) => r.expectation);
              const ok = JSON.stringify(failed) === JSON.stringify(["builtin: sandboxPageUrl"])
                && s.hits.ga4 && s.hits.ga4.add_to_cart > 0 && s.hits.meta
                && require("fs").existsSync(s.path);
              if (!ok) { console.error(JSON.stringify(s, null, 2)); process.exit(1); }
            '
          done
          kill %1

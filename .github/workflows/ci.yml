name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack and install the tarball
        run: |
          pnpm pack
          tmp=$(mktemp -d)
          npm i -g --prefix "$tmp" ./pingwright-*.tgz
          "$tmp/bin/pingwright" --version
          echo "PW_BIN=$tmp/bin/pingwright" >> "$GITHUB_ENV"
      - name: Install from git
        run: |
          tmp2=$(mktemp -d)
          npm i -g --prefix "$tmp2" "git+file://$PWD"
          "$tmp2/bin/pingwright" --version
      - run: $PW_BIN install-browser
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
      - name: Run a scenario against the fixture site
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
        run: |
          pnpm fixture > fixture.log 2>&1 &
          for i in $(seq 1 30); do grep -q '^shop:' fixture.log && break; sleep 1; done
          url=$(sed -n 's/^shop: *//p' fixture.log)
          set +e
          "$PW_BIN" run e2e/scenarios/reject.yml --site "$url" --out "$RUNNER_TEMP/runs"
          code=$?
          set -e
          # The fixture's sandboxed pixel makes the built-in sandbox check fail, so exit 1 is the expected result.
          test "$code" = 1
          kill %1

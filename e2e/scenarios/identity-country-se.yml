start: /products/fake-tee
identity:
  country: SE
steps:
  - consent: accept
  - addToCart: "#add-to-cart"
  - visit: /checkout?pattern=sgtm
    label: checkout
  - fill:
      "#email": email
      "#first-name": firstName
      "#last-name": lastName
      "#phone": phone
      "#address1": address1
      "#city": city
      "#zip": zip
      "#country": country
  - click: "#continue"
  - fill:
      "#card-number": "4242424242424242"
      "#card-expiry": "12/34"
      "#card-cvc": "123"
  - click: "#pay"
    label: pay
  - wait: 7s
    label: thank-you
  - visit: /sgtm-plain
    label: plain
  - wait: 1s
expect:
  must:
    - { vendor: sgtm, event: purchase, identity.hashesMatch: true }
options: { seed: 1, allowUnknownDestination: true }

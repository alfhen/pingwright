start: /products/fake-tee
steps:
  - consent: accept
  - addToCart: "#add-to-cart"
  - visit: /checkout
  - fill:
      "#email": email
      "#first-name": firstName
      "#last-name": lastName
      "#phone": phone
      "#address1": address1
      "#city": city
      "#zip": zip
      "#country": SE
  - click: "#continue"
  - fill:
      "#card-number": "4242424242424242"
      "#card-expiry": "12/34"
      "#card-cvc": "123"
  - click: "#pay"
  - wait: 7s
expect:
  must:
    - { vendor: ga4, event: purchase, ids.user_id: present, consent.analytics: granted }
    - { vendor: meta, event: Purchase }
    - { vendor: google-ads }
options: { seed: 1, allowUnknownDestination: true }

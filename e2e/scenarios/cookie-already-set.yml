start: /set-cookie-already
steps:
  - wait: 500ms
  - evaluate: "fetch('/session/start?c=pw-fixture-cookie-value').then(() => true)"
  - checkpoint: early
  - wait: 1500ms
  - checkpoint: later
  - consent: reject
  - wait: 1s
expect:
  mustNot:
    - { cookie: _pwalready, before: consent }
options: { seed: 1, allowUnknownDestination: true }

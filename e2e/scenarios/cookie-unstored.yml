start: /set-cookie-unstored
steps:
  - wait: 1s
  - evaluate: "fetch('/session/start?c=pw-fixture-cookie-value').then(() => true)"
  - checkpoint: later
  - consent: reject
  - wait: 1s
expect:
  mustNot:
    - { cookie: _pwunstored, before: consent }
options: { seed: 1, allowUnknownDestination: true }

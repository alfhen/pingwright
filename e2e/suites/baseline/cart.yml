start: /set-cookie-already
steps:
  - wait: 1s
  - evaluate: "new Image().src = 'https://www.google-analytics.com/g/collect?v=2&tid=G-PWTEST0001&cid=7777777777.8888888888&en=page_view&dl=' + encodeURIComponent(location.href); true"
  - wait: 500ms
  - consent: accept
  - evaluate: "new Image().src = 'https://www.google-analytics.com/g/collect?v=2&tid=G-PWTEST0001&cid=7777777777.8888888888&en=add_to_cart'; true"
  - wait: 1s
expect:
  must:
    - { vendor: ga4, event: page_view }
options: { seed: 1, allowUnknownDestination: true }

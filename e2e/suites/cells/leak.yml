start: /identifiers?state=denied
identity:
  email: pw-fixture@example.com
steps:
  - fill:
      "#email": email
  - consent: reject
  - wait: 3s
expect:
  mustNot:
    - { vendor: meta, event: Purchase, in: epoch(denied) }
    - { vendor: ga4, in: epoch(denied), params: { em: pw-fixture@example.com } }
options: { seed: 1, allowUnknownDestination: true }
